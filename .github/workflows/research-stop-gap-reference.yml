name: Research stop-gap reference audit
on:
  workflow_dispatch:
  push:
    branches:
      - research/intraday-professional-setups-20261121
    paths:
      - research/audits/test_stop_gap_reference_20261123.py
      - .github/workflows/research-stop-gap-reference.yml
jobs:
  conservative-fill-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run independent stop-gap and cash-sizing reference tests
        run: python -m unittest discover -s research/audits -p 'test_stop_gap_reference_20261123.py' -v
