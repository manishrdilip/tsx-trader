name: Research independent TSX acceleration grid
on:
  workflow_dispatch:
  push:
    branches:
      - research/intraday-professional-setups-20261121
    paths:
      - "research/daily_acceleration_grid.py"
      - ".github/workflows/research_acceleration.yml"
permissions:
  contents: read
jobs:
  acceleration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy yfinance
      - name: Run distinct 1296-config acceleration experiment
        run: python research/daily_acceleration_grid.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceleration-grid-results
          path: research/acceleration_results/
          if-no-files-found: error
