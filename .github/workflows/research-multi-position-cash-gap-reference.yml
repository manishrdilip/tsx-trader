name: Research multi-position cash and gap reference audit
on:
  push:
    branches:
      - research/intraday-professional-setups-20261121
    paths:
      - research/audit_multi_position_cash_gap_reference_20261123.py
      - .github/workflows/research-multi-position-cash-gap-reference.yml
  workflow_dispatch:
jobs:
  independent-reference:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Execute synthetic cash and gap reference checks
        run: python -m unittest discover -s research -p 'audit_multi_position_cash_gap_reference_20261123.py' -v
