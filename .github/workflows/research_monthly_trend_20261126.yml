name: Research TSX monthly absolute trend
on:
  push:
    branches: [research/intraday-professional-setups-20261121]
    paths: ['.github/workflows/research_monthly_trend_20261126.yml']
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: pip install yfinance pandas numpy
      - run: |
          python - <<'PY'
          import yfinance as yf, pandas as pd, numpy as np
          for sym in ['XIU.TO','XEG.TO','XFN.TO','XMA.TO','XIT.TO','XRE.TO']:
              d=yf.Ticker(sym).history(start='2007-01-01',end='2026-11-26',auto_adjust=False)
              if d.empty: print(sym,'missing'); continue
              if d['Stock Splits'].ne(0).any(): print(sym,'split exclusion'); continue
              d['signal']=d['Adj Close']>d['Adj Close'].rolling(200).mean()
              for cost in [.001,.005]:
                  for start,end in [('2009','2022'),('2023','2026')]:
                      g=d.loc[start:end]; cash=5000.; q=0; pending=None; basis=0; pnl=[]; eq=[]; dividends=0
                      for i,(t,r) in enumerate(g.iterrows()):
                          if q:
                              credit=q*r.Dividends; cash+=credit; dividends+=credit
                          if pending is not None:
                              if pending and not q:
                                  px=r.Open*(1+cost); q=int(cash/px); basis=q*px; cash-=basis; dividends=0
                              elif not pending and q:
                                  proceeds=q*r.Open*(1-cost); cash+=proceeds; pnl.append(proceeds-basis+dividends); q=0
                              pending=None
                          eq.append(cash+q*r.Close)
                          if i+1<len(g) and g.index[i+1].month!=t.month: pending=bool(r.signal)
                      if q:
                          proceeds=q*g.Close.iloc[-1]*(1-cost); cash+=proceeds; pnl.append(proceeds-basis+dividends)
                      eq[-1]=cash
                      e=pd.Series([5000.]+eq); ret=e.pct_change().dropna(); years=(g.index[-1]-g.index[0]).days/365.25
                      gains=sum(x for x in pnl if x>0); losses=-sum(x for x in pnl if x<0)
                      print(sym,cost,start,end,'CAD net',cash-5000,'CAGR',(cash/5000)**(1/years)-1,'DD',(e/e.cummax()-1).min(),'trades',len(pnl),'PF',gains/losses if losses else None,'expectancy',np.mean(pnl) if pnl else None,'Sharpe',ret.mean()/ret.std()*np.sqrt(252) if ret.std() else None)
          print('Exploratory only: current universe survivor bias, split exclusions, optimistic ex-date dividend timing, daily marks, terminal close liquidation, no matched baseline or untouched holdout.')
          PY
