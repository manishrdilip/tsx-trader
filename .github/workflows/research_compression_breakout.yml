name: Research TSX compression breakout grid
on:
  workflow_dispatch:
  push:
    branches:
      - research/intraday-professional-setups-20261121
    paths:
      - "research/daily_compression_breakout_grid.py"
      - ".github/workflows/research_compression_breakout.yml"
permissions:
  contents: read
jobs:
  compression-breakout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy yfinance
      - name: Execute independent TSX compression-breakout research
        run: python research/daily_compression_breakout_grid.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compression-breakout-grid-results
          path: research/compression_breakout_results/
          if-no-files-found: error
