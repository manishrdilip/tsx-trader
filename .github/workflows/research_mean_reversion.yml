name: Research independent daily mean reversion grid
on:
  workflow_dispatch:
  push:
    branches:
      - research/intraday-professional-setups-20261121
    paths:
      - "research/daily_mean_reversion_grid.py"
      - ".github/workflows/research_mean_reversion.yml"
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy yfinance
      - name: Run distinct mean reversion screen and chronological validation
        run: python research/daily_mean_reversion_grid.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mean-reversion-grid-results
          path: research/mean_reversion_results/
          if-no-files-found: warn
