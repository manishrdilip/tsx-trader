name: Research independent TSX gap followthrough grid
on:
  workflow_dispatch:
  push:
    branches:
      - research/intraday-professional-setups-20261121
    paths:
      - "research/daily_gap_followthrough_grid.py"
      - ".github/workflows/research_gap_followthrough.yml"
permissions:
  contents: read
jobs:
  gap-followthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy yfinance
      - name: Test 1944 gap continuation and reversal configurations
        run: python research/daily_gap_followthrough_grid.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gap-followthrough-results
          path: research/gap_followthrough_results/
          if-no-files-found: error
