name: Research-only professional intraday setups
on:
  pull_request:
    paths:
      - "research/pro_intraday_test.py"
      - ".github/workflows/pro_intraday_research.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intraday:
    strategy:
      fail-fast: false
      matrix:
        cost: ['0.001', '0.0025', '0.005']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESEARCH_COST_PER_SIDE: ${{ matrix.cost }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy yfinance
      - run: python research/pro_intraday_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intraday-research-results-${{ matrix.cost }}
          path: research/intraday_results/
          if-no-files-found: warn
