name: Lab - intraday Reddit ideas test

on:
  workflow_dispatch:
  push:
    branches: [intraday-test]
    paths: [lab/intraday/**, .github/workflows/intraday-test.yml]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"
      - run: pip install -r lab/requirements.txt
      - run: cd lab/intraday && python ema_vwap_5m.py | tee ../../results_log.txt && mv results ../../ 2>/dev/null; true
      - name: Commit results
        run: |
          mkdir -p results/intraday && cp results_log.txt results/intraday/ema_vwap_5m_log.txt
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add results/intraday && git commit -m "EMA+VWAP 5m results" && git push || true
