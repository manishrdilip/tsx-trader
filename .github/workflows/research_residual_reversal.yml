name: Research TSX residual reversal grid
on:
  workflow_dispatch:
  push:
    branches:
      - research/intraday-professional-setups-20261121
    paths:
      - "research/daily_residual_reversal_grid.py"
      - ".github/workflows/research_residual_reversal.yml"
permissions:
  contents: read
jobs:
  residual:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy yfinance
      - name: Execute independent 2048-configuration residual reversal screen
        run: python research/daily_residual_reversal_grid.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: residual-reversal-results
          path: research/residual_reversal_results/
          if-no-files-found: error
