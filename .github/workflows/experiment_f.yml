name: Experiment F - pre-registered tests (T1-T5 vs frozen E baseline)

on:
  push:
    branches: [pdf-candle-scan]
    paths:
      - "experiment_f/**"
      - ".github/workflows/experiment_f.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pdf-candle-scan
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "yfinance>=0.2.61" "pandas>=2.0" "numpy>=1.24" "exchange_calendars>=4.5" tabulate
      - name: Fetch universe and XIU (2006 onward)
        run: python experiment_d/experiment_d.py fetch --out panel.pkl.gz
      - name: Run pre-registered tests
        run: python experiment_f/experiment_f.py --panel panel.pkl.gz --equities experiment_e/universe.json --out out
      - name: Print report
        run: |
          cat out/report.md
          python -c "import json;[print(r['variant'], json.dumps(r['gates'])) for r in json.load(open('out/results.json'))]"
      - uses: actions/upload-artifact@v4
        with:
          name: experiment-f-report
          path: out/
          retention-days: 30
