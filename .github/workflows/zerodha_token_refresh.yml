# Daily Zerodha login -> fresh access_token. Now runs on the India laptop at 8:15 AM IST
# (india_laptop/setup.ps1); the schedule here is off. Manual runs still push the token
# to the KITE_ACCESS_TOKEN secret for any Kite workflow you trigger by hand.
name: Zerodha Token Refresh

on:
  # Schedule off: Zerodha only accepts API orders from a registered static IP, and
  # GitHub's IPs change every run. This now runs on the India laptop (india_laptop/).
  # schedule:
  #   - cron: "45 2 * * 1-5"   # 8:15 AM IST, Mon–Fri
  workflow_dispatch:           # manual trigger if needed

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright kiteconnect pyotp PyNaCl requests
          playwright install chromium --with-deps

      - name: Refresh Zerodha token
        env:
          KITE_API_KEY:       ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET:    ${{ secrets.KITE_API_SECRET }}
          KITE_USER_ID:       ${{ secrets.KITE_USER_ID }}
          KITE_PASSWORD:      ${{ secrets.KITE_PASSWORD }}
          KITE_TOTP_SECRET:   ${{ secrets.KITE_TOTP_SECRET }}
          GH_TOKEN:           ${{ secrets.GH_TOKEN }}
          GH_REPO:            ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python zerodha_token_refresh.py

      - name: Trigger india monitor immediately after token refresh
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              workflow_id: "india_monitor.yml",
              ref: "main"
            });
