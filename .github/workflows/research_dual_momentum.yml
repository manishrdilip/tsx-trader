name: Research TSX dual momentum grid
on:
  workflow_dispatch:
  push:
    branches:
      - research/intraday-professional-setups-20261121
    paths:
      - "research/daily_dual_momentum_grid.py"
      - ".github/workflows/research_dual_momentum.yml"
permissions:
  contents: read
jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy yfinance
      - name: Research dual momentum with three cost levels
        run: python research/daily_dual_momentum_grid.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dual-momentum-grid-results
          path: research/dual_momentum_results/
          if-no-files-found: error
