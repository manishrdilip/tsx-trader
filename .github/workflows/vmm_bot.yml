name: VMM bot (Wealthsimple via SnapTrade)

# Weekdays ~9:40 ET (14:40 UTC in winter; 10:40 ET in summer). Signals use the previous close.
on:
  schedule:
    # GitHub's timer often drops or delays runs, so several backup slots; the
    # once-a-day guard below makes sure only the first one that fires trades.
    - cron: "40 13 * * 1-5"   # 9:40 ET in summer (EDT); skipped in winter (8:40, before open)
    - cron: "40 14 * * 1-5"   # 9:40 ET in winter (EST)
    - cron: "5 15 * * 1-5"
    - cron: "35 15 * * 1-5"
    - cron: "10 16 * * 1-5"
    - cron: "50 16 * * 1-5"
    - cron: "40 17 * * 1-5"
    - cron: "40 18 * * 1-5"
    # afternoon redeploy run: puts the cash from morning sales back to work the same day
    - cron: "55 18 * * 1-5"   # 2:55 pm ET summer PM run
    - cron: "45 19 * * 1-5"   # 2:45 pm ET winter PM run
    - cron: "15 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vmm-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SNAPTRADE_CLIENT_ID: ${{ secrets.SNAPTRADE_CLIENT_ID }}
      SNAPTRADE_CONSUMER_KEY: ${{ secrets.SNAPTRADE_CONSUMER_KEY }}
      VMM_ACCOUNT_ID: ${{ vars.VMM_ACCOUNT_ID || secrets.VMM_ACCOUNT_ID }}
      # Safety switches (repo Settings -> Secrets and variables -> Actions -> Variables).
      # Orders are sent ONLY when DRY_RUN=false AND TRADING_ENABLED=true.
      DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
      TRADING_ENABLED: ${{ vars.TRADING_ENABLED || 'false' }}
      MAX_ORDER_CAD: ${{ vars.MAX_ORDER_CAD || '800' }}
      MAX_ORDER_PCT: ${{ vars.MAX_ORDER_PCT || '0.10' }}
      MAX_ORDERS_PER_RUN: ${{ vars.MAX_ORDERS_PER_RUN || '25' }}
      VMM_INDEX_LEG: ${{ vars.VMM_INDEX_LEG || 'false' }}
      VMM_MIN_BUDGET: ${{ vars.VMM_MIN_BUDGET || '0' }}
      VMM_ADOPT: ${{ vars.VMM_ADOPT || 'LCFS.TO,MSA.TO,TWM.TO' }}
      VMM_BUDGET_CAD: ${{ vars.VMM_BUDGET_CAD || '0' }}
      VMM_EXCLUDE: ${{ vars.VMM_EXCLUDE || 'LCFS.TO,TWM.TO' }}
      VMM_FUND_TICKER: ${{ vars.VMM_FUND_TICKER || 'VEQT.TO' }}
      VMM_FUND_MAX_CAD: ${{ vars.VMM_FUND_MAX_CAD || '3500' }}
      VMM_FUND_KEEP_CAD: ${{ vars.VMM_FUND_KEEP_CAD || '0' }}
      VMM_PROTECTED: ${{ vars.VMM_PROTECTED || 'XIU.TO,AIQ.TO,SPCX.TO,SPCX' }}
      BROKER_SYMBOL_SUFFIX: ${{ vars.BROKER_SYMBOL_SUFFIX || '.TO' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Once-a-day guard
        id: guard
        run: |
          today=$(TZ=America/Toronto date +%F)
          hm=$(TZ=America/Toronto date +%H%M); hm=$((10#$hm))
          dow=$(TZ=America/Toronto date +%u)
          if [ "$hm" -ge 1430 ]; then slot=PM; else slot=AM; fi
          if [ "$dow" -ge 6 ] || [ "$hm" -lt 930 ] || [ "$hm" -ge 1545 ]; then
            echo "Outside 9:30-3:45 Toronto market window ($hm); no trading."; echo "skip=true" >> $GITHUB_OUTPUT; exit 0
          fi
          echo "RUN_SLOT=$slot" >> $GITHUB_ENV
          done=$(python3 -c "import json;r=json.load(open('results/vmm_bot/state.json')).get('run_slots',{});print('yes' if r.get('date')=='$today' and '$slot' in r.get('slots',[]) else 'no')" 2>/dev/null || echo no)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$done" = "yes" ]; then
            echo "$slot run already done today ($today); skipping."; echo "skip=true" >> $GITHUB_OUTPUT
          else echo "skip=false" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-python@v5.3.0
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4.1.0
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
        if: steps.guard.outputs.skip != 'true'
      - run: npm install --no-audit --no-fund
        if: steps.guard.outputs.skip != 'true'
        working-directory: vmm_bot
      - name: Snapshot account
        if: steps.guard.outputs.skip != 'true'
        run: node vmm_bot/broker.mjs snapshot /tmp/snap.json
      - name: Plan orders
        if: steps.guard.outputs.skip != 'true'
        run: python vmm_bot/plan.py /tmp/snap.json /tmp/plan.json
      - name: Check symbols with broker
        if: steps.guard.outputs.skip != 'true'
        run: node vmm_bot/broker.mjs check /tmp/plan.json
      - name: Execute (dry run unless enabled)
        if: steps.guard.outputs.skip != 'true'
        run: node vmm_bot/broker.mjs execute /tmp/plan.json /tmp/exec.json
      - name: Report
        if: always() && steps.guard.outputs.skip != 'true'
        run: python vmm_bot/report.py /tmp/plan.json /tmp/exec.json
      - name: Commit report
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "vmm-bot"
          git config user.email "vmm-bot@users.noreply.github.com"
          git add results/vmm_bot || true
          git diff --cached --quiet || git commit -m "VMM bot $(date -u +%F)"
          git pull --rebase --autostash && git push
      - name: Phone alert if the run failed
        if: failure()
        run: |
          curl -s -H "Title: VMM bot FAILED" -H "Priority: urgent" -H "Tags: warning" \
            -d "Run failed $(TZ=America/Toronto date '+%a %b %d %H:%M'). Claude reviews it at 2 pm; or tap Run workflow. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/${NTFY_TOPIC:-tsx-dilip-fe7bc02c}"
