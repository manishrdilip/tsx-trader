name: xau-20y
on:
  workflow_dispatch:
  push:
    branches: [xau-20y]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy
      - run: python -u lab/xau_20y.py | tee results/xau_20y.txt
      - uses: actions/upload-artifact@v4
        with: {name: xau-20y, path: results/}
