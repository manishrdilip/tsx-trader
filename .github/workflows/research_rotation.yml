name: Research independent TSX rotation grid
on:
  workflow_dispatch:
  push:
    branches:
      - research/intraday-professional-setups-20261121
    paths:
      - "research/daily_rotation_grid.py"
      - ".github/workflows/research_rotation.yml"
permissions:
  contents: read
jobs:
  rotation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy yfinance
      - run: python research/daily_rotation_grid.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-rotation-grid-results
          path: research/rotation_results/
          if-no-files-found: error
