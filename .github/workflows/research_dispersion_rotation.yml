name: Research TSX dispersion rotation grid
on:
  workflow_dispatch:
  push:
    branches:
      - research/intraday-professional-setups-20261121
    paths:
      - "research/daily_dispersion_rotation_grid.py"
      - ".github/workflows/research_dispersion_rotation.yml"
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy yfinance
      - name: Screen 2304 configurations with three cost scenarios
        run: python research/daily_dispersion_rotation_grid.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dispersion-rotation-results
          path: research/dispersion_rotation_results/
          if-no-files-found: error
