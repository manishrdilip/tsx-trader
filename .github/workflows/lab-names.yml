name: Lab - fetch company names

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["lab/fetch_names.py"]

permissions:
  contents: write

jobs:
  names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python lab/fetch_names.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add universe_names.json
          git commit -m "Company names $(date -u +%F)" || echo "no changes"
          git pull --rebase origin main
          git push
