name: TSX daily scan

on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
  push:                       # re-run whenever the scanner code changes
    branches: [main]
    paths: ["tsx_scan.py", "universe.py", "consensus.py", "candles.py", "leaders.py",
            "livelog.py", "stock_filter.py", ".github/workflows/scan.yml"]

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python tsx_scan.py
      - name: Save results to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add results universe_tickers.json 2>/dev/null || git add results
          git commit -m "Scan $(date -u +%F)" || echo "no changes"
          git pull --rebase origin main
          git push
