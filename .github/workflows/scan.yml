name: TSX daily scan

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run primary scanner (v2.6 fixed)
        run: python tsx_scan_v2_6_fixed.py
        env:
          ACCOUNT: "10000"
      - name: Save results to repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add results universe_tickers.json 2>/dev/null || git add results
          git commit -m "Scan $(date -u +%F)" || echo "no changes"
          git pull --rebase origin main
          git push
