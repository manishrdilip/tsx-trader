name: 10-year backtest (fixed -2% stop / +5% target)

on:
  push:
    branches: [pdf-candle-scan]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"
      - run: pip install "yfinance>=0.2.61" "pandas>=2.0" "numpy>=1.24" tabulate
      - name: Run backtest
        env:
          START_TEST: "2016-11-01"
          EXIT_MODE: "pct"
          STOP_PCT: "0.02"
          TARGET_PCT: "0.05"
          OUT_DIR: "results/backtest_10y_pct"
        run: python backtest_candle.py
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-10y-pct-results
          path: results/backtest_10y_pct/
