name: Research split-boundary accounting audit
on:
  workflow_dispatch:
  push:
    branches:
      - research/intraday-professional-setups-20261121
    paths:
      - research/test_split_boundary_accounting.py
      - .github/workflows/research_split_boundary_accounting.yml
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas
      - run: python research/test_split_boundary_accounting.py
