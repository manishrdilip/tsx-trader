name: Research TSX weekday intraday context grid
on:
  workflow_dispatch:
  push:
    branches:
      - research/intraday-professional-setups-20261121
    paths:
      - "research/daily_weekday_context_grid.py"
      - ".github/workflows/research_weekday_context.yml"
permissions:
  contents: read
concurrency:
  group: research-weekday-context
  cancel-in-progress: false
jobs:
  weekday-context:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy yfinance
      - name: Screen distinct TSX weekday configurations at three cost levels
        run: python research/daily_weekday_context_grid.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekday-context-grid-results
          path: research/weekday_context_results/
          if-no-files-found: error
