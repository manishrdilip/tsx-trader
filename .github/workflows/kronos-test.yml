name: Lab - Kronos out-of-sample test

on:
  workflow_dispatch:
  push:
    branches: [kronos-test]
    paths: [lab/kronos/**, .github/workflows/kronos-test.yml]

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"
      - name: Get Kronos code
        run: git clone --depth 1 https://github.com/shiyu-coder/Kronos.git Kronos
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r Kronos/requirements.txt || true
          pip install yfinance pandas numpy huggingface_hub einops safetensors tqdm
      - run: python -u lab/kronos/kronos_test.py | tee kronos_log.txt
      - name: Commit results
        if: always()
        run: |
          mkdir -p results/kronos && cp kronos_log.txt results/kronos/ || true
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add results/kronos && git commit -m "Kronos test results" && git push || true
