name: Lab - refresh history and backtest (monthly)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 1 * *"     # 1st of every month

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"
      - run: pip install -r lab/requirements.txt
      - run: python lab/fetch_names.py
      - run: python lab/fetch_data.py
      - name: Summarize failed downloads
        run: |
          python - << 'PY'
          import pandas as pd
          df = pd.read_csv("lab/data/failed.csv")
          print(f"Total failures: {len(df)}")
          print("\nCount by reason:")
          print(df["reason"].value_counts().to_string())
          tsx = df[df["ticker"].str.endswith((".TO", ".V"))]
          print(f"\nFirst 30 TSX/TSXV failures ({len(tsx)} total):")
          print(tsx.head(30).to_string(index=False))
          PY
      - run: python lab/run_lab.py
      - run: python lab/export_check.py
      - run: python lab/signals_day.py
      - run: python lab/paper_sim.py
      - run: python lab/refresh_card.py
      - name: Save results to main
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add universe_names.json lab/results results/tdry_check.csv results/tdry_signals.csv results/signals_2026-10-08.csv results/paper_sim_daily.csv results/paper_sim_trades.csv results/paper_sim_summary.txt
          git commit -m "Lab refresh $(date -u +%F)" || echo "no changes"
          git pull --rebase origin main
          git push
