name: Candle + indicator scan (Candlestick Trading Bible rules)

on:
  workflow_dispatch:
    inputs:
      account:
        description: "CAD cap per trade"
        default: "100"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"
      - run: pip install "yfinance>=0.2.61" "pandas>=2.0" "numpy>=1.24" tabulate
      - name: Run scan
        env:
          ACCOUNT: ${{ inputs.account }}
        run: python pdf_candle_scan.py
      - uses: actions/upload-artifact@v4
        with:
          name: candle-scan-results
          path: results/pdf_candle/
