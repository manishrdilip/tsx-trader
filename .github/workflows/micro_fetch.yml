name: micro data fetch (research only, no trading)
on:
  push:
    branches: [micro-test]
    paths: [lab/micro/fetch.py, .github/workflows/micro_fetch.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install yfinance pandas pyarrow
      - run: cd lab/micro && python fetch.py
      - run: |
          git config user.name micro-bot && git config user.email micro-bot@users.noreply.github.com
          git add -f lab/micro/data/*.parquet && git commit -m "micro: intraday bars" && git push
