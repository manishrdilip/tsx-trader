name: StockScanner - 10-year backtest (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"
      - name: Clone StockScanner (read-only)
        run: git clone --depth 1 https://github.com/ChernyshovYuriy/StockScanner ss
      - name: Install StockScanner requirements
        run: pip install -r ss/requirements.txt
      - name: Run 10-year backtest, $5,000 CAD, same window as the lab
        working-directory: ss
        run: python run_backtest.py --start 2016-10-31 --end 2026-10-30 --capital 5000 --quiet
      - name: Save results to main
        run: |
          mkdir -p results/stockscanner
          cp -r ss/out/. results/stockscanner/ 2>/dev/null || echo "no out/ folder"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add results/stockscanner
          git commit -m "StockScanner 10-year backtest $(date -u +%F)" || echo "no changes"
          git pull --rebase origin main
          git push
