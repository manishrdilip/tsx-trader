name: Research TSX volatility compression cash grid
on:
  workflow_dispatch:
  push:
    branches:
      - research/intraday-professional-setups-20261121
    paths:
      - "research/compression_breakout_grid.py"
      - ".github/workflows/research_compression_cash_grid.yml"
permissions:
  contents: read
jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas yfinance
      - name: Run 864 distinct configurations across three costs
        run: python research/compression_breakout_grid.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compression-cash-grid
          path: research/compression_breakout_results/
          if-no-files-found: warn
