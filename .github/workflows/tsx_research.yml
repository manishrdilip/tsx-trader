name: Research-only TSX independent backtest
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/independent_tsx_backtest.py"
      - ".github/workflows/tsx_research.yml"
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy yfinance
      - run: python research/independent_tsx_backtest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tsx-research-results
          path: research/results/
          if-no-files-found: warn
