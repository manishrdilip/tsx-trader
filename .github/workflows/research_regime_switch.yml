name: Research independent TSX regime-switch grid
on:
  workflow_dispatch:
  push:
    branches:
      - research/intraday-professional-setups-20261121
    paths:
      - "research/daily_regime_switch_grid.py"
      - ".github/workflows/research_regime_switch.yml"
permissions:
  contents: read
jobs:
  regime-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy yfinance
      - name: Run 1728 distinct daily regime-switch parameter combinations and 3 cost stresses
        run: python research/daily_regime_switch_grid.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regime-switch-grid-results
          path: research/regime_switch_results/
          if-no-files-found: error
